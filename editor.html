<!DOCTYPE html>
<html>
<head>
    <title>Cadence Writer - Writing Session</title>
    <link rel="stylesheet" href="style.css">
    <link href="vendor/quill/quill.snow.css" rel="stylesheet">
    <link rel="stylesheet" href="css/editor.css">
</head>
<body>
    <div class="editor-container">
        <div class="editor-header">
            <div class="session-info">
                <span class="session-mode" id="sessionMode">Timer Mode</span>
                <div class="session-progress">
                    <span class="progress-label" id="progressLabel">Time Remaining:</span>
                    <span class="progress-value" id="progressValue">25:00</span>
                </div>
                <div class="session-progress">
                    <span class="progress-label">Words:</span>
                    <span class="progress-value" id="wordCount">0</span>
                </div>
            </div>
            <div class="editor-controls">
                <button class="control-btn" id="pauseBtn">Pause</button>
                <button class="control-btn" id="saveBtn">Save</button>
                <button class="control-btn" id="exitBtn">Exit Session</button>
            </div>
            <!-- In the editor-header div, after editor-controls -->
            <button class="fullscreen-btn" id="fullscreenToggle" title="Toggle Fullscreen">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path>
                </svg>
            </button>
        </div>
        
        <div id="editor-wrapper">
            <div class="editor-main">
                <div id="editor"></div>
            </div>
        </div>
    </div>
    
    <!-- Success Modal -->
    <div class="overlay" id="overlay"></div>
    <div class="success-modal" id="successModal">
        <h2>🎉 Congratulations!</h2>
        <p id="successMessage">You've completed your writing session!</p>
        <div class="modal-buttons">
            <button class="modal-btn primary" id="startNewSprintBtn">Start New Sprint</button>
            <button class="modal-btn secondary" id="newSessionBtn">Freewrite</button>
            <button class="modal-btn secondary" id="finishBtn">Finish</button>
        </div>
    </div>
    
    <!-- Reward Popup -->
    <div class="reward-popup" id="rewardPopup" style="display: none;">
        <div class="reward-content">
            <h3>🎉 Reward Earned!</h3>
            <div class="reward-image" id="rewardImage"></div>
            <p>Keep up the great work!</p>
        </div>
    </div>
    
    <!-- Punishment Alert Sound -->
    <audio id="punishmentAlarm" loop>
        <source src="data:audio/wav;base64,UklGRnoGAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQoGAACBhYqFbF1fdJivrJBhNjVgodDbq2EcBj+a2/LDciUFLIHO8tiJNwgZaLvt559NEAxQp+PwtmMcBjiR1/LMeSwFJHfH8N2QQAoUX7Ps4adREAtGn9/0xG0gBDuT2/N" type="audio/wav">
    </audio>
    
<!-- Add Quill from CDN -->
<script src="vendor/quill/quill.min.js"></script>
<script src="js/editor.js"></script>
<script src="achievement-notifications.js"></script>
<script src="visibility-controller.js"></script>
<script src="theme-manager.js"></script>
</body>
</html>
