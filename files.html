<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Files - Cadence Writer</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="css/files.css">
</head>
<body>
    <header>
        <div class="optionsnav">
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li>Files</li>
                <li><a href="statistics.html">Statistics</a></li>
                <li><a href="settings.html">Settings</a></li>
            </ul>
            <button class="fullscreen-btn" id="fullscreenToggle" title="Toggle Fullscreen">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path>
                </svg>
            </button>
        </div>
    </header>
    
    <div class="files-container">
        <h1>Your Files</h1>
        
        <div class="files-controls">
            <div class="search-box">
                <input type="text" placeholder="Search files..." id="searchInput">
            </div>
            <div class="sort-controls">
                <span class="sort-label">Sort by:</span>
                <select class="sort-select" id="sortSelect">
                    <option value="date">Date Modified</option>
                    <option value="name">Name</option>
                    <option value="words">Word Count</option>
                </select>
            </div>
        </div>
        
        <div class="files-grid" id="filesGrid">
            <!-- Files will be loaded here dynamically -->
        </div>
        
        <!-- Empty state (hidden by default) -->
        <div class="empty-state" style="display: none;">
            <h3>No files yet</h3>
            <p>Start your first writing session to see your files here</p>
            <button class="create-new-btn" onclick="window.location.href='index.html'">Start Writing</button>
        </div>
    </div>

<script src="js/files.js"></script>
    <script src="achievement-notifications.js"></script>
    <script src="visibility-controller.js"></script>
    <script src="theme-manager.js"></script>
</body>
</html>
